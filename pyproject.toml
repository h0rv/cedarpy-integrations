[build-system]
requires = ["uv_build>=0.13.9,<0.14"]
build-backend = "uv_build"

[project]
name = "cedarpy-integrations"
version = "0.1.0a0"
description = "Typed Cedar policies and authorization adapters for Python web applications"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.13"
dependencies = ["cedarpy>=4.12.2"]

[project.urls]
Repository = "https://github.com/h0rv/cedarpy-integrations"
Issues = "https://github.com/h0rv/cedarpy-integrations/issues"

[project.optional-dependencies]
asgi = ["anyio>=4,<5", "starlette>=0.37,<2"]
fastapi = ["anyio>=4,<5", "starlette>=0.37,<2", "fastapi"]

[tool.uv.build-backend]
module-name = ["cedarpy_policy", "cedarpy_web", "cedarpy_asgi", "cedarpy_wsgi"]
